<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暑假營隊 CRM 管理系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;background:#F0F2F5;color:#1a1a2e;min-height:100vh}
:root{
  --blue:#2563EB;--blue-light:#EFF6FF;--blue-mid:#BFDBFE;
  --green:#16A34A;--green-light:#F0FDF4;--green-mid:#BBF7D0;
  --red:#DC2626;--red-light:#FEF2F2;
  --orange:#EA580C;--orange-light:#FFF7ED;
  --purple:#7C3AED;--purple-light:#F5F3FF;
  --teal:#0D9488;--teal-light:#F0FDFA;
  --gray:#6B7280;--gray-light:#F9FAFB;--gray-border:#E5E7EB;
  --sidebar-w:220px;
  --header-h:60px;
}

/* ─── Layout ─── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:#1e2235;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--gray-border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:20px}

/* ─── Sidebar ─── */
.sidebar-logo{padding:16px 16px 8px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-logo h1{color:#fff;font-size:15px;font-weight:700;line-height:1.3}
.sidebar-logo p{color:rgba(255,255,255,0.45);font-size:11px;margin-top:2px}
.sidebar-section{padding:10px 10px 4px;color:rgba(255,255,255,0.3);font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 6px;border-radius:7px;cursor:pointer;color:rgba(255,255,255,0.65);font-size:13px;transition:all .15s;user-select:none}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#fff}
.nav-item.active{background:#2563EB;color:#fff;font-weight:600}
.nav-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nav-count{margin-left:auto;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);font-size:10px;padding:1px 6px;border-radius:10px}
.nav-item.active .nav-count{background:rgba(255,255,255,0.25);color:#fff}

/* ─── Topbar ─── */
.topbar-title{font-size:16px;font-weight:700;color:#1a1a2e;flex:1}
.search-wrap{position:relative;flex:1;max-width:300px}
.search-wrap input{width:100%;padding:7px 12px 7px 34px;border:1px solid var(--gray-border);border-radius:8px;font-size:13px;background:#F9FAFB;outline:none;transition:.15s}
.search-wrap input:focus{border-color:#93C5FD;background:#fff}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9CA3AF;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s;white-space:nowrap}
.btn-primary{background:#2563EB;color:#fff}
.btn-primary:hover{background:#1D4ED8}
.btn-secondary{background:#fff;color:#374151;border:1px solid var(--gray-border)}
.btn-secondary:hover{background:#F3F4F6}
.btn-danger{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}
.btn-danger:hover{background:#FEE2E2}
.btn-sm{padding:5px 10px;font-size:12px}

/* ─── Stats cards ─── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid var(--gray-border)}
.stat-label{font-size:11px;color:var(--gray);font-weight:500;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:700;color:#1a1a2e}
.stat-sub{font-size:11px;color:var(--gray);margin-top:2px}
.stat-card.blue .stat-val{color:#2563EB}
.stat-card.green .stat-val{color:#16A34A}
.stat-card.orange .stat-val{color:#EA580C}
.stat-card.purple .stat-val{color:#7C3AED}

/* ─── Table ─── */
.table-wrap{background:#fff;border-radius:12px;border:1px solid var(--gray-border);overflow:hidden}
.table-header{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--gray-border);gap:10px}
.table-header h2{font-size:14px;font-weight:700;flex:1}
.filter-wrap{display:flex;gap:6px;align-items:center}
.filter-select{padding:5px 10px;border:1px solid var(--gray-border);border-radius:7px;font-size:12px;background:#F9FAFB;outline:none;cursor:pointer;color:#374151}

.crm-table{width:100%;border-collapse:collapse;font-size:13px}
.crm-table th{padding:9px 12px;background:#F8FAFC;color:#6B7280;font-weight:600;font-size:11px;text-align:left;border-bottom:1px solid var(--gray-border);white-space:nowrap;position:sticky;top:0;z-index:1}
.crm-table td{padding:10px 12px;border-bottom:1px solid #F3F4F6;vertical-align:middle;max-width:200px}
.crm-table tr:last-child td{border-bottom:none}
.crm-table tr:hover td{background:#FAFBFF}
.crm-table tbody tr{transition:background .1s}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-yellow{background:#FEF9C3;color:#854D0E}
.badge-green{background:#DCFCE7;color:#166534}
.badge-blue{background:#DBEAFE;color:#1E40AF}
.badge-red{background:#FEE2E2;color:#991B1B}
.badge-gray{background:#F3F4F6;color:#4B5563}
.badge-teal{background:#CCFBF1;color:#115E59}
.badge-deal{background:#DCFCE7;color:#166534;font-size:12px}
.badge-nodeal{background:#F3F4F6;color:#9CA3AF}

.avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:#fff}

.cell-name{display:flex;align-items:center;gap:8px}
.cell-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.col-actions{display:flex;gap:4px;opacity:0;transition:.15s}
.crm-table tr:hover .col-actions{opacity:1}
.th-sort{cursor:pointer;user-select:none;white-space:nowrap}
.th-sort:hover{color:#2563EB;background:#F0F6FF}
.sort-icon{display:inline-block;margin-left:4px;font-size:10px;opacity:.5;vertical-align:middle}
.th-sort.asc .sort-icon::after{content:"▲";opacity:1;color:#2563EB}
.th-sort.desc .sort-icon::after{content:"▼";opacity:1;color:#2563EB}
.th-sort:not(.asc):not(.desc) .sort-icon::after{content:"⇅"}
.filter-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#F8FAFC;border-bottom:1px solid var(--gray-border);flex-wrap:wrap}
.filter-bar label{font-size:11px;font-weight:600;color:#6B7280;white-space:nowrap}
.date-input{padding:5px 8px;border:1px solid var(--gray-border);border-radius:7px;font-size:12px;background:#fff;outline:none;color:#374151;cursor:pointer}
.date-input:focus{border-color:#93C5FD}
.btn-clear-date{padding:4px 10px;border-radius:6px;border:1px solid #FECACA;background:#FEF2F2;color:#DC2626;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-clear-date:hover{background:#FEE2E2}
.filter-divider{width:1px;height:18px;background:var(--gray-border);margin:0 2px}
.action-btn{padding:4px 7px;border-radius:5px;border:1px solid var(--gray-border);background:#fff;cursor:pointer;font-size:11px;color:#6B7280;transition:.1s}
.action-btn:hover{background:#F3F4F6;color:#111}
.action-btn.del:hover{background:#FEE2E2;color:#DC2626;border-color:#FECACA}

/* ─── Modal ─── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-title span{font-size:18px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.full{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;font-weight:600;color:#374151}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid var(--gray-border);border-radius:7px;font-size:13px;outline:none;font-family:inherit;transition:.15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#93C5FD;box-shadow:0 0 0 3px rgba(37,99,235,0.08)}
.form-group textarea{resize:vertical;min-height:60px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--gray-border)}

/* ─── Add column modal ─── */
.col-preview{background:#F8FAFC;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:12px;color:#6B7280;border:1px solid var(--gray-border)}
.existing-cols{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.col-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:#EFF6FF;color:#2563EB;border-radius:5px;font-size:11px;font-weight:600}
.col-tag.custom{background:#F5F3FF;color:#7C3AED}
.col-tag .del-col{cursor:pointer;opacity:.6;font-size:12px;margin-left:2px}
.col-tag .del-col:hover{opacity:1;color:#DC2626}

/* ─── Empty state ─── */
.empty-state{text-align:center;padding:48px 20px;color:#9CA3AF}
.empty-state svg{width:48px;height:48px;margin:0 auto 12px;opacity:.4}
.empty-state p{font-size:14px}

/* ─── Inline edit ─── */
.inline-edit{border:1px solid #93C5FD;border-radius:4px;padding:2px 6px;font-size:13px;width:100%;outline:none;font-family:inherit;background:#EFF6FF}

/* ─── Toast ─── */
.toast{position:fixed;bottom:24px;right:24px;background:#1e2235;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;z-index:200;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* ─── Scrollbar ─── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:4px}

/* ════ RWD ════ */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:49}
.sidebar-overlay.show{display:block}
.tab-bar{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;background:#1e2235;border-top:1px solid rgba(255,255,255,0.08);z-index:60;flex-direction:row;align-items:stretch}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:rgba(255,255,255,0.45);font-size:10px;font-weight:600;border:none;background:transparent;transition:.15s;position:relative}
.tab-btn.active{color:#60A5FA}
.tab-btn .tab-icon{font-size:20px;line-height:1}
.tab-badge{position:absolute;top:6px;right:calc(50% - 18px);background:#F59E0B;color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px}
.tab-badge.show{display:flex}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:#374151;font-size:22px;flex-shrink:0}
@media(max-width:767px){
  :root{--sidebar-w:240px;--header-h:52px}
  .app{flex-direction:column}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);z-index:50;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
  .sidebar.open{transform:translateX(0)}
  .main{flex:1;min-width:0;padding-bottom:60px}
  .tab-bar{display:flex}
  .hamburger{display:flex;align-items:center;justify-content:center}
  .topbar{padding:0 12px;gap:8px;height:52px}
  .topbar-title{font-size:13px}
  .search-wrap{max-width:none;flex:1}
  .filter-bar{padding:8px 10px;gap:5px}
  .filter-select{font-size:11px;padding:4px 6px}
  .btn{padding:6px 10px;font-size:12px}
  .btn-text-hide{display:none}
  .content{padding:10px}
  .stats-grid{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .stat-card{padding:10px 12px}
  .stat-val{font-size:18px}
  .table-header{padding:10px 12px}
  .crm-table{font-size:12px}
  .crm-table th,.crm-table td{padding:7px 8px}
  .col-hide-mobile{display:none}
  .modal{padding:16px;width:96vw;max-height:88vh;border-radius:12px}
  .form-row{grid-template-columns:1fr}
  .filter-divider{display:none}
  .date-input{font-size:11px;padding:4px 6px}
}
@media(min-width:768px) and (max-width:1023px){
  :root{--sidebar-w:190px}
  .topbar{padding:0 14px}
  .search-wrap{max-width:210px}
  .content{padding:14px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .crm-table{font-size:12px}
  .crm-table th,.crm-table td{padding:8px 10px}
  .modal{width:88vw}
}
@media(min-width:1024px){
  .hamburger{display:none!important}
  .tab-bar{display:none!important}
  .sidebar{transform:none!important;position:relative}
}

/* ── School groups ── */
.sidebar-group-label{padding:6px 14px 2px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.28);display:flex;align-items:center;gap:6px;margin-top:6px}
.sidebar-group-label::after{content:"";flex:1;height:1px;background:rgba(255,255,255,0.08)}

/* ── Reminder badge ── */
.remind-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.remind-card{background:#fff;border-radius:10px;border:1px solid var(--gray-border);margin-bottom:14px;overflow:hidden}
.remind-header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#FFFBEB;border-bottom:1px solid #FEF3C7;cursor:pointer;user-select:none}
.remind-header h3{font-size:13px;font-weight:700;flex:1;color:#92400E}
.remind-count{background:#F59E0B;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.remind-table{width:100%;border-collapse:collapse;font-size:12px}
.remind-table th{padding:7px 12px;background:#FFFBEB;color:#78350F;font-weight:600;font-size:11px;text-align:left;border-bottom:1px solid #FEF3C7}
.remind-table td{padding:8px 12px;border-bottom:1px solid #F9FAFB;vertical-align:middle}
.remind-table tr:last-child td{border-bottom:none}
.remind-table tr:hover td{background:#FFFDF5}
.days-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.days-over-30{background:#FEE2E2;color:#991B1B}
.days-5-30{background:#FEF3C7;color:#92400E}
.days-3-5{background:#FEF9C3;color:#854D0E}

/* ── Rename modal ── */
.rename-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #F3F4F6}
.rename-row:last-child{border-bottom:none}
.rename-old{font-size:13px;color:#374151;flex:1;font-weight:500}
.rename-input{flex:1.5;padding:5px 9px;border:1px solid var(--gray-border);border-radius:6px;font-size:13px;outline:none;font-family:inherit}
.rename-input:focus{border-color:#93C5FD}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <h1>🏕 暑假營隊 CRM</h1>
      <p>廣告投放管理系統</p>
    </div>
    <div class="sidebar-section">校區總覽</div>
    <div id="nav-all" class="nav-item active" onclick="switchSchool('__all__')" data-school="__all__">
      <span style="font-size:15px">📋</span> 全部校區
      <span class="nav-count" id="cnt-all">0</span>
    </div>
    <div id="nav-items"></div>
    <div style="margin-top:auto;padding:8px 10px;border-top:1px solid rgba(255,255,255,0.08)">
      <div class="nav-item" onclick="openReminders()" style="color:rgba(255,255,255,0.6)" id="reminder-nav-btn">
        <span style="font-size:15px">🔔</span> 追蹤提醒
        <span class="nav-count" id="reminder-total-cnt" style="background:#F59E0B;color:#fff;display:none">0</span>
      </div>
      <div class="nav-item" onclick="openAddCol()" style="color:rgba(255,255,255,0.6)">
        <span style="font-size:15px">➕</span> 管理欄位
      </div>
      <div class="nav-item" onclick="openManageSchools()" style="color:rgba(255,255,255,0.6)">
        <span style="font-size:15px">🏫</span> 管理校區
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">全部校區</div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="搜尋姓名、學校、電話…" oninput="renderTable()">
      </div>
      <select class="filter-select" id="filter-status" onchange="renderTable()">
        <option value="">所有狀態</option>
        <option>未回覆</option>
        <option>已回覆</option>
        <option>已試聽</option>
        <option>待追蹤</option>
        <option>不參加</option>
        <option>無需求</option>
      </select>
      <select class="filter-select" id="filter-deal" onchange="renderTable()">
        <option value="">是否成交</option>
        <option value="yes">已成交</option>
        <option value="no">未成交</option>
      </select>
      <button class="btn btn-primary" onclick="openAddMember()">＋ 增加成員</button>
    </div>

    <div class="filter-bar" id="filter-bar">
      <label>日期區間</label>
      <input type="date" class="date-input" id="date-from" onchange="renderTable()" title="起始日期">
      <span style="font-size:12px;color:#9CA3AF">—</span>
      <input type="date" class="date-input" id="date-to" onchange="renderTable()" title="結束日期">
      <button class="btn-clear-date" onclick="clearDateFilter()">✕ 清除</button>
      <div class="filter-divider"></div>
      <label>目前排序</label>
      <span id="sort-label" style="font-size:12px;color:#2563EB;font-weight:600">預設</span>
      <button class="btn-clear-date" style="background:#EFF6FF;color:#2563EB;border-color:#BFDBFE" onclick="clearSort()">✕ 重置</button>
    </div>

    <div class="content">
      <div class="stats-grid" id="stats-grid"></div>
      <div class="table-wrap">
        <div class="table-header">
          <h2 id="table-title">載入中…</h2>
          <div style="flex:1"></div>
          <button class="btn btn-secondary btn-sm" onclick="exportCSV()">⬇ 匯出 CSV</button>
        </div>
        <div style="overflow-x:auto">
          <table class="crm-table" id="crm-table">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Member Modal -->
<div class="modal-overlay" id="modal-member">
  <div class="modal">
    <div class="modal-title"><span>👤</span> <span id="member-modal-title">新增成員</span></div>
    <div class="form-row">
      <div class="form-group">
        <label>校區 *</label>
        <select id="f-school" required></select>
      </div>
      <div class="form-group">
        <label>日期</label>
        <input type="text" id="f-date" placeholder="05/29">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>FB 名稱</label>
        <input type="text" id="f-fb" placeholder="Facebook 顯示名稱">
      </div>
      <div class="form-group">
        <label>孩子姓名</label>
        <input type="text" id="f-child-name" placeholder="孩子姓名">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>孩子年級</label>
        <input type="text" id="f-grade" placeholder="三年級 / 小二…">
      </div>
      <div class="form-group">
        <label>就讀學校</label>
        <input type="text" id="f-school-name" placeholder="XX國小">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>聯絡手機</label>
        <input type="text" id="f-phone" placeholder="09-XXXXXXXX">
      </div>
      <div class="form-group">
        <label>追蹤狀況</label>
        <select id="f-status">
          <option>未回覆</option><option>已回覆</option><option>已試聽</option>
          <option>待追蹤</option><option>不參加</option><option>無需求</option>
        </select>
      </div>

function setLastEdit(id){ const e=getLastEdits(); e[String(id)]=Date.now(); localStorage.setItem("crm_last_edits",JSON.stringify(e)); }
function getDaysSinceEdit(id){ const e=getLastEdits(); const t=e[String(id)]; if(!t) return null; return Math.floor((Date.now()-t)/(1000*60*60*24)); }

const FIXED_COLS = ["日期","FB名稱","孩子姓名","孩子年級","就讀學校","聯絡手機","備註","追蹤狀況","是否成交"];
let customCols = JSON.parse(localStorage.getItem("crm_custom_cols")||"[]");
let allData = {};
let currentSchool = "__all__";
let editingId = null;
let idCounter = 0;
let sortCol = null;
let sortDir = "asc";

function init(){
  // Init allData for ALL schools in groups (including new ones)
  getAllSchools().forEach(s=>{
    const raw = RAW[s]||[];
    allData[s] = raw.map(r=>{
      const row = Object.assign({},r);
      if(!row._id) row._id = ++idCounter;
      customCols.forEach(c=>{ if(row[c.name]===undefined) row[c.name]=""; });
      return row;
    });
    if(!SCHOOLS.includes(s)) SCHOOLS.push(s);
  });
  buildNav();
  buildSchoolSelect();
  switchSchool("__all__");
}

function getAllRows(){
  let rows = [];
  SCHOOLS.forEach(s=> allData[s].forEach(r=> rows.push(Object.assign({},r,{_school:s}))) );
  return rows;
}

function getRows(){
  if(currentSchool==="__all__") return getAllRows();
  return (allData[currentSchool]||[]).map(r=>Object.assign({},r,{_school:currentSchool}));
}

function buildNav(){
  const el = document.getElementById("nav-items");
  el.innerHTML = "";
  document.getElementById("cnt-all").textContent = getAllRows().length;
  const groups = getSchoolGroups();
  const icons = {"國小":"🎒","國中":"📚","高中":"🎓"};
  Object.entries(groups).forEach(([level,schools])=>{
    if(!schools.length) return;
    const lbl = document.createElement("div");
    lbl.className = "sidebar-group-label";
    lbl.innerHTML = `${icons[level]||"🏫"} ${level}`;
    el.appendChild(lbl);
    schools.forEach(s=>{
      const c = SCHOOL_COLORS[s]||{dot:"#9CA3AF"};
      const cnt = (allData[s]||[]).length;
      const div = document.createElement("div");
      div.className = "nav-item"+(currentSchool===s?" active":"");
      div.id = "nav-"+s;
      div.setAttribute("data-school",s);
      div.onclick = ()=>switchSchool(s);
      div.innerHTML = `<span class="dot" style="background:${c.dot}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s}</span><span class="nav-count">${cnt}</span>`;
      el.appendChild(div);
    });
  });
  // update reminder badges (sidebar + tab bar)
  const reminderRows = getReminderRows();
  const cnt = reminderRows.length;
  const badge = document.getElementById("reminder-total-cnt");
  if(badge){ badge.textContent=cnt; badge.style.display=cnt>0?"inline":"none"; }
  if(typeof updateTabBadge==="function") updateTabBadge();
}

function switchSchool(s){
  currentSchool = s;
  document.querySelectorAll(".nav-item[data-school]").forEach(el=>{
    el.classList.toggle("active", el.getAttribute("data-school")===s);
  });
  document.getElementById("topbar-title").textContent = s==="__all__"?"全部校區":s;
  document.getElementById("search-input").value="";
  document.getElementById("filter-status").value="";
  document.getElementById("filter-deal").value="";
  document.getElementById("date-from").value="";
  document.getElementById("date-to").value="";
  sortCol=null; sortDir="asc";
  updateSortLabel();
  renderStats();
  renderTable();
}

function isDeal(v){ return v==="TRUE"||v==="X"||v==="是"||v==="✓"||v===true; }

function statusBadge(s){
  const map={
    "未回覆":"badge-yellow","已回覆":"badge-blue","已試聽":"badge-teal",
    "待追蹤":"badge-blue","不參加":"badge-red","無需求":"badge-gray"
  };
  return `<span class="badge ${map[s]||"badge-gray"}">${s||"—"}</span>`;
}

function avatarColor(name){
  const colors=["#2563EB","#16A34A","#DC2626","#7C3AED","#EA580C","#0D9488","#DB2777"];
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))%colors.length;
  return colors[h];
}

function initials(name){
  if(!name) return "?";
  const n = name.trim();
  if(n.length<=2) return n;
  if(/[a-zA-Z]/.test(n[0])){
    const parts=n.split(" ");
    return parts.length>1?(parts[0][0]+parts[1][0]).toUpperCase():n.slice(0,2).toUpperCase();
  }
  return n.slice(0,2);
}

function renderStats(){
  const rows = getRows();
  const total = rows.length;
  const replied = rows.filter(r=>["已回覆","已試聽","待追蹤"].includes(r["追蹤狀況"])).length;
  const deals = rows.filter(r=>isDeal(r["是否成交"])).length;
  const noReply = rows.filter(r=>r["追蹤狀況"]==="未回覆").length;
  document.getElementById("stats-grid").innerHTML = `
    <div class="stat-card blue"><div class="stat-label">總名單數</div><div class="stat-val">${total}</div><div class="stat-sub">所有廣告回應</div></div>
    <div class="stat-card green"><div class="stat-label">已回覆 / 追蹤中</div><div class="stat-val">${replied}</div><div class="stat-sub">有效接觸</div></div>
    <div class="stat-card orange"><div class="stat-label">未回覆</div><div class="stat-val">${noReply}</div><div class="stat-sub">待跟進</div></div>
    <div class="stat-card purple"><div class="stat-label">成交數</div><div class="stat-val">${deals}</div><div class="stat-sub">轉換率 ${total?Math.round(deals/total*100):0}%</div></div>
  `;
}

const SORTABLE_COLS = ["日期","FB名稱","孩子姓名","就讀學校","聯絡手機","備註"];

function parseDateVal(str){
  if(!str) return 0;
  const m = str.match(/(\d+)\/(\d+)/);
  if(m) return parseInt(m[1])*100+parseInt(m[2]);
  const d = new Date(str);
  return isNaN(d)?0:d.getTime();
}

function compareVal(a,b,col){
  if(col==="日期") return parseDateVal(a)-parseDateVal(b);
  const sa=String(a||"").toLowerCase(), sb=String(b||"").toLowerCase();
  return sa<sb?-1:sa>sb?1:0;
}

function updateSortLabel(){
  const el=document.getElementById("sort-label");
  if(!sortCol){el.textContent="預設";return;}
  el.textContent=`${sortCol} ${sortDir==="asc"?"↑ 遞增":"↓ 遞減"}`;
}

function toggleSort(col){
  if(!SORTABLE_COLS.includes(col)) return;
  if(col==="校區"){ return; }
  if(sortCol===col){ sortDir=sortDir==="asc"?"desc":"asc"; }
  else{ sortCol=col; sortDir="asc"; }
  updateSortLabel();
  renderTable();
}

function clearSort(){ sortCol=null; sortDir="asc"; updateSortLabel(); renderTable(); }
function clearDateFilter(){
  document.getElementById("date-from").value="";
  document.getElementById("date-to").value="";
  renderTable();
}

function renderTable(){
  const q = document.getElementById("search-input").value.toLowerCase();
  const fs = document.getElementById("filter-status").value;
  const fd = document.getElementById("filter-deal").value;
  const dfrom = document.getElementById("date-from").value;
  const dto   = document.getElementById("date-to").value;

  let rows = getRows().filter(r=>{
    if(q){
      const haystack = [r["FB名稱"],r["孩子姓名"],r["就讀學校"],r["聯絡手機"],r["備註"]].join(" ").toLowerCase();
      if(!haystack.includes(q)) return false;
    }
    if(fs && r["追蹤狀況"]!==fs) return false;
    if(fd==="yes" && !isDeal(r["是否成交"])) return false;
    if(fd==="no" && isDeal(r["是否成交"])) return false;
    if(dfrom||dto){
      const rv = parseDateVal(r["日期"]);
      if(dfrom){
        const d=new Date(dfrom); const fv=((d.getMonth()+1)*100+d.getDate());
        if(rv<fv) return false;
      }
      if(dto){
        const d=new Date(dto); const tv=((d.getMonth()+1)*100+d.getDate());
        if(rv>tv) return false;
      }
    }
    return true;
  });

  if(sortCol){
    const col = sortCol;
    rows.sort((a,b)=>{
      const va = col==="校區"?a._school:a[col];
      const vb = col==="校區"?b._school:b[col];
      const r = compareVal(va,vb,col);
      return sortDir==="asc"?r:-r;
    });
  }

  const schoolLabel = currentSchool==="__all__"?"全部校區":currentSchool;
  document.getElementById("table-title").textContent = `${schoolLabel}（${rows.length} 筆）`;

  const allCols = [...FIXED_COLS, ...customCols.map(c=>c.name)];
  const showSchoolCol = currentSchool==="__all__";

  const SORT_LABEL = {"校區":"校區","日期":"日期","FB名稱":"FB名稱","孩子姓名":"孩子姓名","就讀學校":"就讀學校","聯絡手機":"聯絡手機","備註":"備註"};

  // Build header
  let th = "<tr>";
  if(showSchoolCol){
    const sc = sortCol==="校區"?` th-sort ${sortDir}`:"th-sort";
    th += `<th class="${sc}" onclick="toggleSort('校區')">校區<span class="sort-icon"></span></th>`;
  }
  const MOBILE_HIDE = ["孩子年級","備註"];
  allCols.forEach(c=>{
    const hc = MOBILE_HIDE.includes(c)?' col-hide-mobile':'';
    if(SORTABLE_COLS.includes(c)){
      const sc2 = sortCol===c?` th-sort ${sortDir}`:"th-sort";
      th+=`<th class="${sc2}${hc}" onclick="toggleSort('${c}')" title="點擊排序">${c}<span class="sort-icon"></span></th>`;
    } else {
      th+=`<th class="${hc.trim()}">${c}</th>`;
    }
  });
  th += "<th>操作</th></tr>";
  document.getElementById("table-head").innerHTML = th;

  // Build body
  if(!rows.length){
    const span = allCols.length + (showSchoolCol?1:0) + 1;
    document.getElementById("table-body").innerHTML = `<tr><td colspan="${span}" style="padding:40px;text-align:center;color:#9CA3AF">查無資料</td></tr>`;
    return;
  }

  let html = "";
  rows.forEach(row=>{
    const id = row._id;
    const school = row._school;
    const sc = SCHOOL_COLORS[school]||{bg:"#6B7280",dot:"#6B7280"};
    html += `<tr>`;
    if(showSchoolCol){
      html += `<td><span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:${sc.bg}"><span style="width:6px;height:6px;border-radius:50%;background:${sc.dot};flex-shrink:0"></span>${school}</span></td>`;
    }
    allCols.forEach(col=>{
      let val = row[col]||"";
      if(col==="FB名稱"){
        const av = `<span class="avatar" style="background:${avatarColor(val||"?")};">${initials(val||"?")}</span>`;
        html += `<td><div class="cell-name">${av}<span class="cell-text" title="${val}">${val||"—"}</span></div></td>`;
      } else if(col==="追蹤狀況"){
        html += `<td>${statusBadge(val)}</td>`;
      } else if(col==="是否成交"){
        html += `<td><span class="badge ${isDeal(val)?"badge-deal":"badge-nodeal"}">${isDeal(val)?"✅ 成交":"—"}</span></td>`;
      } else if(col==="備註"){
        html += `<td class="col-hide-mobile" style="max-width:180px"><span style="font-size:12px;color:#6B7280;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical" title="${val}">${val||""}</span></td>`;
      } else {
        const hcg = MOBILE_HIDE.includes(col)?' col-hide-mobile':'';
        html += `<td class="${hcg.trim()}"><span class="cell-text" title="${val}">${val||""}</span></td>`;
      }
    });
    html += `<td><div class="col-actions">
      <button class="action-btn" onclick="editMember(${id},'${school.replace(/'/g,"\'")}')">✏️</button>
      <button class="action-btn del" onclick="deleteMember(${id},'${school.replace(/'/g,"\'")}')">🗑</button>
    </div></td>`;
    html += `</tr>`;
  });
  document.getElementById("table-body").innerHTML = html;
}

function openAddMember(){
  editingId = null;
  document.getElementById("member-modal-title").textContent = "新增成員";
  document.getElementById("save-member-btn").textContent = "儲存成員";
  ["f-date","f-fb","f-child-name","f-grade","f-school-name","f-phone","f-remark"].forEach(id=> document.getElementById(id).value="");
  document.getElementById("f-status").value="未回覆";
  document.getElementById("f-deal").value="FALSE";
  if(currentSchool!=="__all__") document.getElementById("f-school").value=currentSchool;
  renderCustomFieldsForm({});
  document.getElementById("modal-member").classList.add("show");
}

function editMember(id, school){
  const row = allData[school].find(r=>r._id===id);
  if(!row) return;
  editingId = {id, school};
  document.getElementById("member-modal-title").textContent = "編輯成員";
  document.getElementById("save-member-btn").textContent = "更新成員";
  document.getElementById("f-school").value = school;
  document.getElementById("f-date").value = row["日期"]||"";
  document.getElementById("f-fb").value = row["FB名稱"]||"";
  document.getElementById("f-child-name").value = row["孩子姓名"]||"";
  document.getElementById("f-grade").value = row["孩子年級"]||"";
  document.getElementById("f-school-name").value = row["就讀學校"]||"";
  document.getElementById("f-phone").value = row["聯絡手機"]||"";
  document.getElementById("f-remark").value = row["備註"]||"";
  document.getElementById("f-status").value = row["追蹤狀況"]||"未回覆";
  document.getElementById("f-deal").value = isDeal(row["是否成交"])?"X":"FALSE";
  renderCustomFieldsForm(row);
  document.getElementById("modal-member").classList.add("show");
}

function renderCustomFieldsForm(row){
  const el = document.getElementById("custom-fields-form");
  if(!customCols.length){ el.innerHTML=""; return; }
  let html = `<div style="height:1px;background:var(--gray-border);margin:10px 0"></div><div style="font-size:11px;font-weight:600;color:#7C3AED;margin-bottom:8px">自訂欄位</div>`;
  html += `<div class="form-row">`;
  customCols.forEach((c,i)=>{
    if(i>0&&i%2===0) html += `</div><div class="form-row">`;
    const val = row[c.name]||"";
    if(c.type==="select"){
      html += `<div class="form-group"><label>${c.name}</label><select id="cf-${i}">`;
      html += `<option value="">—</option>`;
      (c.options||[]).forEach(o=> html+=`<option${val===o?' selected':''}>${o}</option>`);
      html += `</select></div>`;
    } else if(c.type==="date"){
      html += `<div class="form-group"><label>${c.name}</label><input type="date" id="cf-${i}" value="${val}"></div>`;
    } else {
      html += `<div class="form-group"><label>${c.name}</label><input type="text" id="cf-${i}" value="${val}" placeholder="${c.name}…"></div>`;
    }
  });
  html += `</div>`;
  el.innerHTML = html;
}

function saveMember(){
  const school = document.getElementById("f-school").value;
  if(!school){ showToast("請選擇校區","error"); return; }
  const fb = document.getElementById("f-fb").value.trim();
  const childName = document.getElementById("f-child-name").value.trim();
  if(!fb && !childName){ showToast("請填寫 FB 名稱或孩子姓名","error"); return; }
  const row = {
    "日期": document.getElementById("f-date").value,
    "FB名稱": fb,
    "孩子姓名": childName,
    "孩子年級": document.getElementById("f-grade").value,
    "就讀學校": document.getElementById("f-school-name").value,
    "聯絡手機": document.getElementById("f-phone").value,
    "備註": document.getElementById("f-remark").value,
    "追蹤狀況": document.getElementById("f-status").value,
    "是否成交": document.getElementById("f-deal").value,
  };
  customCols.forEach((c,i)=>{
    const el = document.getElementById("cf-"+i);
    row[c.name] = el ? el.value : "";
  });
  if(editingId){
    const idx = allData[editingId.school].findIndex(r=>r._id===editingId.id);
    if(idx>=0){
      const orig_id = allData[editingId.school][idx]._id;
      allData[editingId.school][idx] = Object.assign({},row,{_id:orig_id});
    }
    showToast("成員資料已更新");
  } else {
    row._id = ++idCounter;
    if(!allData[school]) allData[school]=[];
    allData[school].unshift(row);
    showToast("新成員已新增");
  }
  // record last-edit timestamp
  if(editingId){ setLastEdit(editingId.id); }
  else if(row._id){ setLastEdit(row._id); }
  closeModal("modal-member");
  buildNav();
  renderStats();
  renderTable();
}

function deleteMember(id, school){
  if(!confirm("確定刪除此成員？")) return;
  allData[school] = allData[school].filter(r=>r._id!==id);
  buildNav();
  renderStats();
  renderTable();
  showToast("已刪除成員","warn");
}

function openAddCol(){

  document.getElementById("new-col-type").value="text";

function renderExistingCols(){
  const el = document.getElementById("existing-cols");
  let html = FIXED_COLS.map(c=>`<span class="col-tag">${c}</span>`).join("");
  customCols.forEach((c,i)=>{
    html += `<span class="col-tag custom">${c.name} <span class="del-col" onclick="deleteCol(${i})">✕</span></span>`;
  });
  el.innerHTML = html || "<span style='color:#9CA3AF;font-size:12px'>尚無自訂欄位</span>";
}

function deleteCol(i){
  if(!confirm(`刪除欄位「${customCols[i].name}」？`)) return;
  customCols.splice(i,1);
  saveCustomCols();
  renderExistingCols();
  renderTable();
  showToast("欄位已刪除","warn");
}

function updateColPreview(){
  const name = document.getElementById("new-col-name").value.trim();
  const type = document.getElementById("new-col-type").value;
  const typeLabel = {text:"文字",select:"下拉選單",date:"日期"};
  document.getElementById("col-preview").textContent = name
    ? `預覽：「${name}」欄位 — 類型：${typeLabel[type]}`
    : "預覽：尚未輸入欄位名稱";
  document.getElementById("select-options-row").style.display = type==="select"?"block":"none";
}
document.getElementById("new-col-name").addEventListener("input",updateColPreview);
document.getElementById("new-col-type").addEventListener("change",updateColPreview);

function addColumn(){
  const name = document.getElementById("new-col-name").value.trim();
  if(!name){ showToast("請輸入欄位名稱","error"); return; }
  if(FIXED_COLS.includes(name)||customCols.find(c=>c.name===name)){
    showToast("欄位名稱重複","error"); return;
  }
  const type = document.getElementById("new-col-type").value;
  const options = type==="select"?document.getElementById("new-col-options").value.split(",").map(s=>s.trim()).filter(Boolean):[];
  customCols.push({name,type,options});
  SCHOOLS.forEach(s=> allData[s].forEach(r=>{ if(r[name]===undefined) r[name]=""; }));
  saveCustomCols();
  document.getElementById("new-col-name").value="";
  document.getElementById("new-col-options").value="";
  updateColPreview();
  renderExistingCols();
  renderTable();
  showToast(`欄位「${name}」已新增`);
}

function showSchoolTab(tab){
  ['list','add','rename'].forEach(t=>{
    document.getElementById('school-panel-'+t).style.display = t===tab?'block':'none';
    const btn = document.getElementById('school-tab-'+t);
    if(btn) btn.style.fontWeight = t===tab?'700':'400';
  });

  if(tab==='rename') renderRenameList();
}

function renderExistingSchools(){
  const groups = getSchoolGroups();
  const icons = {"國小":"🎒","國中":"📚","高中":"🎓"};
  const colors = {"國小":"#2563EB","國中":"#16A34A","高中":"#7C3AED"};
  const defaults = ["文化極光校","竹北知行校","內壢森耀校","青埔翱翔校","快樂騰雲校","大園晨光校","中壢心夢想校","大園參天校","園中方舟校","青埔旭日校","青埔升大校"];
  let html="";
  Object.entries(groups).forEach(([level,schools])=>{
    if(!schools.length) return;
    html+=`<div style="font-size:10px;font-weight:700;color:${colors[level]||"#374151"};margin:8px 0 4px;letter-spacing:.5px">${icons[level]||""} ${level}</div>`;
    schools.forEach(s=>{
      const c = SCHOOL_COLORS[s]||{dot:"#9CA3AF"};
      const cnt = (allData[s]||[]).length;
      const isDefault = defaults.includes(s);
      html+=`<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:#F9FAFB;border-radius:7px;border:1px solid #E5E7EB;margin-bottom:3px">
        <span style="width:9px;height:9px;border-radius:50%;background:${c.dot};flex-shrink:0"></span>
        <span style="flex:1;font-size:13px;font-weight:500">${s}</span>
        <span style="font-size:11px;color:#9CA3AF">${cnt} 筆</span>
        ${!isDefault?`<button onclick="deleteSchool('${level}','${s}')" style="padding:2px 8px;border-radius:5px;border:1px solid #FECACA;background:#FEF2F2;color:#DC2626;font-size:11px;cursor:pointer">刪除</button>`:'<span style="font-size:10px;color:#D1D5DB;padding:0 4px">預設</span>'}
      </div>`;
    });
  });
  document.getElementById("existing-schools").innerHTML = html || "<span style='color:#9CA3AF;font-size:12px'>尚無校區</span>";
}

function addSchool(){
  const name = document.getElementById("new-school-name").value.trim();
  if(!name){ showToast("請輸入校區名稱","error"); return; }
  const level = document.getElementById("new-school-level").value;
  const color = document.getElementById("new-school-color").value;
  const groups = getSchoolGroups();
  if(Object.values(groups).flat().includes(name)){ showToast("校區名稱重複","error"); return; }
  if(!groups[level]) groups[level]=[];
  groups[level].push(name);
  saveSchoolGroups(groups);
  SCHOOL_COLORS[name]={bg:color,light:"#F9FAFB",dot:color};
  const saved = JSON.parse(localStorage.getItem("crm_school_colors")||"{}");
  saved[name]={bg:color,light:"#F9FAFB",dot:color};
  localStorage.setItem("crm_school_colors",JSON.stringify(saved));
  if(!allData[name]) allData[name]=[];
  if(!SCHOOLS.includes(name)) SCHOOLS.push(name);
  document.getElementById("new-school-name").value="";
  showSchoolTab('list');
  buildNav();
  buildSchoolSelect();
  showToast(`校區「${name}」已新增`);
}

function deleteSchool(level,name){
  if((allData[name]||[]).length>0){ showToast("此校區還有資料，無法刪除","error"); return; }
  if(!confirm(`確定刪除「${name}」校區？`)) return;
  const groups=getSchoolGroups();
  groups[level]=(groups[level]||[]).filter(s=>s!==name);
  saveSchoolGroups(groups);
  delete allData[name];
  const idx=SCHOOLS.indexOf(name); if(idx>-1) SCHOOLS.splice(idx,1);
  renderExistingSchools();
  buildNav();
  buildSchoolSelect();
  showToast(`「${name}」已刪除`,"warn");
}

function renderRenameList(){
  const groups = getSchoolGroups();
  const icons = {"國小":"🎒","國中":"📚","高中":"🎓"};
  let html="";
  Object.entries(groups).forEach(([level,schools])=>{
    if(!schools.length) return;
    html+=`<div style="font-size:10px;font-weight:700;color:#6B7280;margin:8px 0 4px">${icons[level]||""} ${level}</div>`;
    schools.forEach((s,i)=>{
      html+=`<div class="rename-row">
        <span class="rename-old">${s}</span>
        <span style="color:#9CA3AF;font-size:12px;margin:0 6px">→</span>
        <input class="rename-input" data-level="${level}" data-old="${s}" placeholder="${s}" value="">
      </div>`;
    });
  });
  document.getElementById("rename-list").innerHTML = html;
}

function saveRenames(){
  const inputs = document.querySelectorAll(".rename-input");
  const groups = getSchoolGroups();
  let changed = 0;
  inputs.forEach(inp=>{
    const newName = inp.value.trim();
    const oldName = inp.getAttribute("data-old");
    const level = inp.getAttribute("data-level");
    if(!newName || newName===oldName) return;
    if(Object.values(groups).flat().includes(newName)){ showToast(`「${newName}」名稱重複`,"error"); return; }
    // rename in groups
    const idx = (groups[level]||[]).indexOf(oldName);
    if(idx>-1) groups[level][idx]=newName;
    // rename in allData
    allData[newName] = allData[oldName]||[];
    delete allData[oldName];
    // rename in SCHOOLS
    const si = SCHOOLS.indexOf(oldName); if(si>-1) SCHOOLS[si]=newName;
    // copy colors
    if(SCHOOL_COLORS[oldName]){ SCHOOL_COLORS[newName]=SCHOOL_COLORS[oldName]; delete SCHOOL_COLORS[oldName]; }
    // fix _school refs
    (allData[newName]||[]).forEach(r=>{ if(r._school===oldName) r._school=newName; });
    changed++;
  });
  if(changed>0){
    saveSchoolGroups(groups);
    buildNav();
    buildSchoolSelect();
    closeModal("modal-schools");
    showToast(`已完成 ${changed} 個校區改名`);
    if(currentSchool!=="__all__" && !getAllSchools().includes(currentSchool)) switchSchool("__all__");
    else{ renderStats(); renderTable(); }
  } else {
    showToast("沒有輸入新名稱","warn");
  }
}

// ─── Reminder System ──────────────────────────────────────────────────────────
const REMIND_TIERS = [
  { label:"超過 1 個月", days:30, cls:"days-over-30", icon:"🔴" },
  { label:"超過 5 天",   days:5,  cls:"days-5-30",    icon:"🟡" },
  { label:"超過 3 天",   days:3,  cls:"days-3-5",     icon:"🟢" },
];

function getReminderRows(){
  const results=[];
  getAllRows().forEach(r=>{
    if(isDeal(r["是否成交"])) return;
    if(!["待追蹤","未回覆","已回覆"].includes(r["追蹤狀況"])) return;
    const days = getDaysSinceEdit(r._id);
    if(days===null||days<3) return;
    results.push({...r, _days:days});
  });
  return results;
}

function openReminders(){
  renderReminderContent();
  document.getElementById("modal-reminders").classList.add("show");
}

function renderReminderContent(){
  const rows = getReminderRows();
  if(!rows.length){
    document.getElementById("reminder-content").innerHTML=`<div style="text-align:center;padding:32px;color:#9CA3AF"><div style="font-size:32px;margin-bottom:8px">🎉</div><p>目前沒有需要追蹤的成員！</p></div>`;
    return;
  }
  let html="";
  REMIND_TIERS.forEach(tier=>{
    const tierRows = rows.filter(r=> tier.days===30 ? r._days>=30 : tier.days===5 ? (r._days>=5&&r._days<30) : (r._days>=3&&r._days<5));
    if(!tierRows.length) return;
    html+=`<div class="remind-card">
      <div class="remind-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'">
        <span>${tier.icon}</span>
        <h3>${tier.label}未追蹤</h3>
        <span class="remind-count">${tierRows.length} 人</span>
        <span style="color:#92400E;font-size:12px">▼</span>
      </div>
      <div>
        <table class="remind-table">
          <thead><tr><th>校區</th><th>FB名稱</th><th>孩子姓名</th><th>聯絡手機</th><th>狀態</th><th>已過天數</th><th></th></tr></thead>
          <tbody>`;
    tierRows.sort((a,b)=>b._days-a._days).forEach(r=>{
      const c=SCHOOL_COLORS[r._school]||{dot:"#9CA3AF"};
      html+=`<tr>
        <td><span style="font-size:11px;font-weight:600;color:${c.bg}">${r._school}</span></td>
        <td>${r["FB名稱"]||"—"}</td>
        <td>${r["孩子姓名"]||"—"}</td>
        <td>${r["聯絡手機"]||"—"}</td>
        <td>${statusBadge(r["追蹤狀況"])}</td>
        <td><span class="days-badge ${tier.cls}">${r._days} 天</span></td>
        <td><button class="action-btn" onclick="editMember(${r._id},'${r._school.replace(/'/g,"\'")}');closeModal('modal-reminders')">編輯</button></td>
      </tr>`;
    });
    html+=`</tbody></table></div></div>`;
  });
  document.getElementById("reminder-content").innerHTML=html;
}

function saveCustomCols(){
  try{ localStorage.setItem("crm_custom_cols", JSON.stringify(customCols)); }catch(e){}
}

function buildSchoolSelect(){
  const el = document.getElementById("f-school");
  const groups = getSchoolGroups();
  const icons = {"國小":"🎒","國中":"📚","高中":"🎓"};
  let html = `<option value="">— 請選擇 —</option>`;
  Object.entries(groups).forEach(([level,schools])=>{
    if(!schools.length) return;
    html += `<optgroup label="${icons[level]||""} ${level}">`;
    schools.forEach(s=> html+=`<option value="${s}">${s}</option>`);
    html += `</optgroup>`;
  });
  el.innerHTML = html;
}

// ─── Utilities ───────────────────────────────────────────────────────────────
function closeModal(id){ document.getElementById(id).classList.remove("show"); }

document.querySelectorAll(".modal-overlay").forEach(el=>{
  el.addEventListener("click",e=>{ if(e.target===el) el.classList.remove("show"); });
});

function showToast(msg, type){
  const t = document.getElementById("toast");
  t.textContent = (type==="error"?"❌ ":type==="warn"?"⚠️ ":"✅ ")+msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}

function exportCSV(){
  const rows = getRows();
  const allCols = [...FIXED_COLS, ...customCols.map(c=>c.name)];
  const showSchoolCol = currentSchool==="__all__";
  const headers = showSchoolCol?["校區",...allCols]:allCols;
  const lines = [headers.join(",")];
  rows.forEach(r=>{
    const vals = showSchoolCol?[r._school,...allCols.map(c=>r[c]||"")]:allCols.map(c=>r[c]||"");
    lines.push(vals.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
  });
  const blob = new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="CRM_匯出.csv"; a.click();
  showToast("CSV 已匯出");
}

// ─── RWD / Mobile ─────────────────────────────────────────────────────────────
function toggleSidebar(){
  const s = document.getElementById("sidebar");
  const o = document.getElementById("sidebar-overlay");
  const isOpen = s.classList.contains("open");
  s.classList.toggle("open", !isOpen);
  o.classList.toggle("show", !isOpen);
}
function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-overlay").classList.remove("show");
}

function tabSwitch(tab){
  // update active state
  ['home','search','remind','add','menu'].forEach(t=>{
    const btn = document.getElementById('tab-btn-'+t);
    if(btn) btn.classList.toggle('active', t===tab);
  });
  if(tab==='home'){
    closeSidebar();
    // scroll table into view
    document.getElementById('crm-table')?.closest('.table-wrap')?.scrollIntoView({behavior:'smooth',block:'start'});
  } else if(tab==='search'){
    closeSidebar();
    const inp = document.getElementById('search-input');
    inp.focus();
    inp.scrollIntoView({behavior:'smooth',block:'center'});
  } else if(tab==='remind'){
    closeSidebar();
    openReminders();
  } else if(tab==='add'){
    closeSidebar();
    openAddMember();
  } else if(tab==='menu'){
    toggleSidebar();
    // reset to home tab visually after sidebar opens
    setTimeout(()=>{ document.getElementById('tab-btn-menu')?.classList.remove('active'); document.getElementById('tab-btn-home')?.classList.add('active'); }, 300);
  }
}

function updateTabBadge(){
  const cnt = getReminderRows().length;
  const badge = document.getElementById('tab-remind-badge');
  if(badge){ badge.textContent=cnt; badge.classList.toggle('show', cnt>0); }
}

// close sidebar when switching schools on mobile
const _baseSwitchSchool = switchSchool;
window.switchSchool = function(s){
  _baseSwitchSchool(s);
  if(window.innerWidth < 768) closeSidebar();
};

init();

<script>
function mobileTabAction(type,e){
 document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
 if(e?.currentTarget)e.currentTarget.classList.add('active');

 switch(type){
  case 'list':
   document.querySelector('.content')?.scrollTo({top:0,behavior:'smooth'});
   break;
  case 'search':
   const s=document.getElementById('search-input');
   if(s){
    s.focus();
    s.classList.add('search-highlight');
    setTimeout(()=>s.classList.remove('search-highlight'),1500);
   }
   break;
  case 'reminder':
   if(typeof openReminders==='function') openReminders();
   break;
  case 'add':
   if(typeof openAddMember==='function') openAddMember();
   break;
  case 'menu':
   toggleSidebar();
   break;
 }
}

function toggleSidebar(){
 let sb=document.getElementById('sidebar');
 if(!sb) return;

 let ov=document.getElementById('sidebar-overlay');
 if(!ov){
   ov=document.createElement('div');
   ov.id='sidebar-overlay';
   ov.className='sidebar-overlay';
   ov.onclick=function(){
      sb.classList.remove('open');
      ov.classList.remove('show');
   };
   document.body.appendChild(ov);
 }

 sb.classList.toggle('open');
 ov.classList.toggle('show');
}

function updateReminderBadge(){
 const source=document.getElementById('reminder-total-cnt');
 const target=document.getElementById('mobileReminderBadge');
 if(!source || !target) return;

 const n=parseInt(source.textContent||'0');
 target.textContent=n;
 if(n>0) target.classList.add('show');
}

setTimeout(updateReminderBadge,1500);

// Ctrl+K 快速搜尋
document.addEventListener('keydown',function(e){
 if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='k'){
   e.preventDefault();
   document.getElementById('search-input')?.focus();
 }
});
</script>
